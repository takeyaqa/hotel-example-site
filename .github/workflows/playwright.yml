name: Playwright Tests
on:
  schedule:
    - cron: "18 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - run: pnpm ci
      - run: pnpm run test
        env:
          USE_DEPLOYED_SITE: "true"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
